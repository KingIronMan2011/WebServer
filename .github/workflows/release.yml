name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize release attempts. A second push waits for the first run, then sees its release.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit fuzzing dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: fuzz
      - name: Verify dashboard lockfile, quality, and production bundle
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm lint
          pnpm format:check
          pnpm types
          pnpm build
          test -f dist/index.html
          test -d dist/assets
      - name: Verify Rust formatting, lints, unit, integration, and security tests
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

  check_release:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not determine the package version from Cargo.toml." >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
            echo "Release $tag already exists; skipping build."
          else
            exists=false
            echo "Release $tag does not exist; building release assets."
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_linux:
    needs: [check_release, verify]
    if: needs.check_release.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-x86_64
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: dashboard
      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - run: |
          mkdir -p release/webserver
          cp target/x86_64-unknown-linux-gnu/release/webserver release/webserver/
          cp -R packaging release/webserver/
          cp -R dashboard/dist release/webserver/dashboard
          cp -R docs release/webserver/
          cp README.md TODO.md release/webserver/
          test -f release/webserver/dashboard/index.html
          test -f release/webserver/docs/UPGRADING.md
          tar -C release -czf webserver-linux-x86_64.tar.gz webserver
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webserver-linux-x86_64
          path: webserver-linux-x86_64.tar.gz
          if-no-files-found: error

  build_windows:
    needs: [check_release, verify]
    if: needs.check_release.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-x86_64
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: dashboard
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\webserver | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\webserver.exe release\webserver\
          Copy-Item packaging release\webserver\packaging -Recurse
          Copy-Item dashboard\dist release\webserver\dashboard -Recurse
          Copy-Item docs release\webserver\docs -Recurse
          Copy-Item README.md, TODO.md release\webserver\
          if (-not (Test-Path release\webserver\dashboard\index.html)) { throw "Dashboard bundle is missing" }
          if (-not (Test-Path release\webserver\docs\UPGRADING.md)) { throw "Upgrade guide is missing" }
          Compress-Archive -Path release\webserver -DestinationPath webserver-windows-x86_64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webserver-windows-x86_64
          path: webserver-windows-x86_64.zip
          if-no-files-found: error

  publish_release:
    needs: [check_release, build_linux, build_windows]
    if: >-
      always() &&
      needs.check_release.outputs.exists == 'false' &&
      needs.build_linux.result == 'success' &&
      needs.build_windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.check_release.outputs.tag }}
          name: Webserver v${{ needs.check_release.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
