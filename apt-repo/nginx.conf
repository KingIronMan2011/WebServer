server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
