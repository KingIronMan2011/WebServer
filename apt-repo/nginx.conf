server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /repo;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Repository indexes must not be cached: APT, DNF and pacman must see a
    # newly published package immediately.
    location ~* /(InRelease|Release|Packages|Sources|repomd\.xml|primary\.xml|filelists\.xml|other\.xml|.*\.db(?:\.tar\..*)?)(\.gz|\.bz2|\.xz|\.zst)?$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Packages and signatures are immutable once published.
    location ~* \.(deb|rpm|pkg\.tar\.zst|sig|asc|gpg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable" always;
        expires 30d;
    }
}
