<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>403 — Forbidden</title>
    <style>
      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f5;
        color: #20201e;
        font:
          16px/1.55 Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      .page {
        width: min(100% - 3rem, 46rem);
        border-top: 2px solid #df5b3d;
        padding: 1.5rem 0 3rem;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #d9d9d4;
        padding-bottom: 0.9rem;
        color: #73736d;
        font:
          600 0.72rem/1 ui-monospace,
          SFMono-Regular,
          monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 12ch;
        margin: 4rem 0 1rem;
        font-size: clamp(2.4rem, 7vw, 5.4rem);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.94;
      }
      p {
        max-width: 34rem;
        margin: 0;
        color: #61615b;
      }
      .mark {
        display: inline-block;
        width: 0.62rem;
        height: 0.62rem;
        margin-right: 0.45rem;
        background: #df5b3d;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="meta">
        <span><i class="mark"></i>Webserver</span><span>403 / Forbidden</span>
      </div>
      <h1>This place is not open to you.</h1>
      <p>
        The server understood the request, but access to this resource is not
        available.
      </p>
    </main>
  </body>
</html>
