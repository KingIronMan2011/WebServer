[server]
bind = "0.0.0.0:80"
upstream_timeout_secs = 30
max_header_bytes = 32768
max_body_bytes = 10485760

# Set enabled to true only after the configured domains point to this server.
# Port 80 must be reachable from the Internet for the HTTP-01 validation.
[tls]
enabled = false
bind = "0.0.0.0:443"
# email = "admin@example.com"
certificate_cache = "/etc/webserver/certificates/acme"

# Optional: serve a PEM certificate and key instead of ACME for these hosts.
# Keep local keys root-owned and readable only by the www-data group (0640).
# [[tls.certificates]]
# hosts = ["internal.example.com"]
# certificate = "/etc/webserver/certificates/local/internal.example.com.fullchain.pem"
# private_key = "/etc/webserver/certificates/local/internal.example.com.key.pem"

# DNS-01 supports lego's DNS providers (for example cloudflare, route53 and
# digitalocean), delegated CNAME/NS challenge zones and wildcard certificates.
# Install lego separately and keep this credentials file mode 0600.
# [tls.dns_challenge]
# command = "/usr/bin/lego"
# [[tls.dns_challenge.providers]]
# provider = "cloudflare"
# domains = ["example.com", "*.example.com"]
# credentials_file = "/etc/webserver/dns/cloudflare.env"
# resolvers = ["1.1.1.1:53", "8.8.8.8:53"]
