[server]
bind = "0.0.0.0:80"
upstream_timeout_secs = 30
max_header_bytes = 32768
max_body_bytes = 10485760

# Set enabled to true only after the configured domains point to this server.
# Port 80 must be reachable from the Internet for the HTTP-01 validation.
[tls]
enabled = false
bind = "0.0.0.0:443"
# email = "admin@example.com"
certificate_cache = 'C:\ProgramData\Webserver\certificates\acme'

[admin]
database = 'C:\ProgramData\Webserver\data\admin.db'

# [[tls.certificates]]
# hosts = ["internal.example.com"]
# certificate = 'C:\ProgramData\Webserver\certificates\local\internal.example.com.fullchain.pem'
# private_key = 'C:\ProgramData\Webserver\certificates\local\internal.example.com.key.pem'

# DNS-01 / Wildcard certificates via a lego provider. CNAME and NS delegation
# are followed by lego; credentials are KEY=VALUE lines in a protected file.
# [tls.dns_challenge]
# command = 'C:\Program Files\lego\lego.exe'
# [[tls.dns_challenge.providers]]
# provider = "cloudflare"
# domains = ["example.com", "*.example.com"]
# credentials_file = 'C:\ProgramData\Webserver\dns\cloudflare.env'
