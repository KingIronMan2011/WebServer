[package]
name = "webserver"
version = "0.1.0"
edition = "2024"
description = "A Caddy-inspired reverse proxy and web server written in Rust."
publish = false

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-auto", "tokio"] }
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
