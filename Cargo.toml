[package]
name = "webserver"
version = "1.1.0"
edition = "2024"
description = "A Caddy-inspired reverse proxy and web server written in Rust."
license = "MIT"
publish = false

[dependencies]
async-compression = { version = "0.4", features = ["brotli", "gzip", "tokio"] }
argon2 = { version = "0.5", features = ["password-hash"] }
axum = { version = "0.8", features = ["json", "macros"] }
axum-extra = { version = "0.12", features = ["cookie-private"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-auto", "tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
futures-util = "0.3"
httpdate = "1"
ipnet = { version = "2", features = ["serde"] }
mime_guess = "2"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx-core = { version = "=0.8.6", features = ["_rt-tokio"] }
sqlx-sqlite = { version = "=0.8.6", features = ["bundled", "uuid"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
rustls = "0.23"
quinn = "0.11"
rustls-acme = { version = "0.15", features = ["tokio"] }
socket2 = { version = "0.6", features = ["all"] }
tokio-rustls = "0.26"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower_governor = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "set-header", "trace"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rcgen = "0.13"
